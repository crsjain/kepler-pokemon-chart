<!DOCTYPE html>
<html>
<head>
  <title>Verify All Documents</title>
</head>
<body>
  <div id="output" style="white-space: pre-wrap; font-family: monospace;">Querying all users...</div>
  <script type="module">
    import { db } from './firebase.js';
    import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    async function run() {
      try {
        const out = document.getElementById('output');
        const usersRef = collection(db, 'users');
        const snapshot = await getDocs(usersRef);
        
        const results = {};
        for (const docSnapshot of snapshot.docs) {
          const userUid = docSnapshot.id;
          const data = docSnapshot.data();
          if (data && data.profiles) {
            results[userUid] = Object.keys(data.profiles).map(id => `${id} (${data.profiles[id].name})`);
          } else {
            results[userUid] = "NO_PROFILES";
          }
        }
        
        console.log("RESULT_ALL: " + JSON.stringify(results));
      } catch (e) {
        console.error("RESULT_ALL: ERROR: " + e.message);
      }
    }
    run();
  </script>
</body>
</html>
